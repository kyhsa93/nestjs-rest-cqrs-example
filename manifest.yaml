apiVersion: v1
kind: Service
metadata:
  name: nest
  labels:
    app: nest
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 5000
  selector:
    app: nest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest
  labels:
    app: nest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nest
  template:
    metadata:
      labels:
        app: nest
    spec:
      containers:
        - name: nest
          image: kyhsa93/nestjs-rest-cqrs-example
          ports:
            - containerPort: 5000
          env:
            - name: AWS_REGION
              value: "ap-northeast-2"
            # Targets real AWS, so there is no AWS_ENDPOINT override and
            # credentials come from the pod's IAM role (e.g. IRSA).
            # Replace the placeholders with your own SQS queue URLs.
            - name: AWS_SQS_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/<ACCOUNT_ID>/<QUEUE_NAME>"
            - name: SQS_DOMAIN_EVENT_QUEUE_URL
              value: "https://sqs.ap-northeast-2.amazonaws.com/<ACCOUNT_ID>/<DOMAIN_EVENT_QUEUE_NAME>"
            - name: DATABASE_LOGGING
              value: "false"
            - name: DATABASE_HOST
              value: "database"
            - name: DATABASE_PORT
              value: "3306"
            - name: DATABASE_NAME
              value: "nest"
            - name: DATABASE_SECRET_ID
              value: "nest/database"
            - name: DATABASE_SYNC
              value: "true"
            - name: EMAIL
              value: "test@test.com"
            - name: PORT
              value: "5000"
          resources:
            requests:
              memory: "1024M"
              cpu: "500m"
            limits:
              memory: "1024M"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: database
  labels:
    app: database
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: database
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  labels:
    app: database
spec:
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          image: mysql
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: nest
            - name: MYSQL_ROOT_PASSWORD
              value: test
          resources:
            requests:
              memory: "1024M"
              cpu: "500m"
            limits:
              memory: "1024M"
              cpu: "500m"
