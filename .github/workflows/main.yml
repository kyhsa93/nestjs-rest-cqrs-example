name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: architecture harness (backend-service-playbook skill, adopt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MIN_SCORE: '90'
      # pinned: following another repo's main is what broke this gate on 2026-05-05
      BSP_REF: b83ebfd70436776b98355f019e57050dbbfdf112
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          path: project

      - name: Checkout backend-service-playbook skill
        uses: actions/checkout@v7
        with:
          repository: kyhsa93/backend-service-playbook
          ref: ${{ env.BSP_REF }}
          path: bsp
          sparse-checkout: skills/nestjs-architecture-harness

      - uses: actions/setup-node@v7
        with:
          node-version-file: project/.nvmrc
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install project deps
        working-directory: project
        run: npm ci

      - name: Evaluate
        run: |
          set +e
          bash bsp/skills/nestjs-architecture-harness/scripts/run.sh project --out="$GITHUB_WORKSPACE/eval.json"
          code=$?
          set -e
          # run.sh exits 1 on any medium+ finding; the gate is the score, but no report is a hard error
          if [ "$code" -eq 2 ] || [ ! -s "$GITHUB_WORKSPACE/eval.json" ]; then
            echo "::error::harness produced no report (exit $code)"
            exit 1
          fi

      - name: Summary
        run: |
          jq '{totalScore, grade, failureCount: (.failures | length)}' "$GITHUB_WORKSPACE/eval.json"
          jq '.failures | group_by(.ruleId) | map({ruleId: .[0].ruleId, severity: .[0].severity, count: length})' "$GITHUB_WORKSPACE/eval.json"

      - name: Enforce score threshold
        run: |
          score=$(jq -r .totalScore "$GITHUB_WORKSPACE/eval.json")
          if [ "$score" -lt "$MIN_SCORE" ]; then
            echo "::error::Harness score $score is below required $MIN_SCORE"
            jq '.failures' "$GITHUB_WORKSPACE/eval.json"
            exit 1
          fi
          echo "Harness score $score (>= $MIN_SCORE)"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-report
          path: eval.json

  ci:
    name: lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx eslint ./src ./libs
      - run: npm test
      - run: npm run build

  build-image:
    name: build & push image
    needs: [harness, ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: kyhsa93/nestjs-rest-cqrs-example
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
