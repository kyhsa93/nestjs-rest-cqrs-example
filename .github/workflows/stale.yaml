name: Close stale issues and PRs

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned,security
          stale-issue-message: |
            This issue has been automatically marked as stale because it has had no activity for 60 days. It will be closed in 14 days if no further activity occurs. Comment to keep it open.
          close-issue-message: |
            Closing this issue due to inactivity. Feel free to reopen it if it is still relevant.
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has had no activity for 60 days. It will be closed in 14 days if no further activity occurs. Push a commit or comment to keep it open.
          close-pr-message: |
            Closing this pull request due to inactivity. Feel free to reopen it if you intend to revive it.
