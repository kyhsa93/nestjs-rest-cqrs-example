name: engineer-propose-execute

# engineer(개발) propose/execute 파이프라인 — 공개 저장소 3곳(backend-service-playbook,
# k8s-playbook, nestjs-rest-cqrs-example) 전용, 동일 파일을 세 저장소에 그대로 복사해 둔다
# (group-chro·group-cto 2026-10-06 설계, kyhsa93/agents#11). 이 파이프라인은 agents 저장소의
# exec-sweep과 달리 각 저장소 안에서 자기 저장소 기본 GITHUB_TOKEN만으로 돈다 — 크로스 레포
# PAT 없음. main 브랜치 보호(필수 리뷰 1, 관리자 바이패스 허용)가 켜져 있어 이 토큰은
# main에 못 미친다 — auto/<slug> 브랜치에만 push 가능.
#
# 흐름: bizdev가 우선순위를 매긴 백로그 큐(backlog/queue.md, 이 저장소 자신에 있는 항목만)에서
# 항목 하나를 engineer persona가 구현 시도 → 변경사항을 패치 아티팩트로만 남김(git/gh 커밋·
# 푸시·PR 도구 배제) → execute가 그 패치를 auto/<slug> 브랜치에 적용해 커밋·push·PR 오픈.
# PR 기술 검증은 group-cto가 한다(교차검증 규정, backend-service-playbook#460 전례).
# 머지는 사람(메인 세션)이 한다.

on:
  schedule:
    - cron: "30 14 * * 0"  # KST 월요일 23:30. 안정화 전까지 주 1회로 느슨하게.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 패치만 만들고 커밋·PR을 실제로 올리지 않는다 (첫 실행은 반드시 true)"
        type: boolean
        default: true

concurrency:
  group: engineer-propose-execute
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACKLOG_PATH: "backlog/queue.md"
  MAX_OPEN_AUTO_PRS: "3"
  LIVE: ${{ vars.ENGINEER_SWEEP_LIVE == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      has_patch: ${{ steps.draft.outputs.has_patch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i -g @anthropic-ai/claude-code

      - name: engineer 헤드리스 구현 시도 (커밋·PR 도구 배제, 패치만 남김)
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ENGINEER_SWEEP_ANTHROPIC_KEY }}
          PATCH_PATH: ${{ runner.temp }}/engineer.patch
          META_PATH: ${{ runner.temp }}/engineer-meta.json
        run: |
          PROMPT="너는 engineer다. .claude/agents/engineer.md를 네 정의로 읽고 그대로 따른다
          (없으면 '정의 없음'으로 보고하고 끝낸다 — 아직 배포 전일 수 있다).

          '${BACKLOG_PATH}'에서 bizdev가 이미 '개발할 만하다'고 판정해 둔 항목 하나를
          받아 구현을 시도해라(파일이 없거나 항목이 없으면 '백로그 없음'으로 보고하고
          끝낸다 — 0건이 정상이다). 우선순위를 네가 다시 매기지 마라 — 맨 위(또는
          표시된 다음) 항목 하나만 받는다.

          너는 git commit·git push·gh pr create·gh issue create 권한이 없다
          (의도적이다). 구현은 이 체크아웃 안에서 파일을 고치는 것으로 끝내고,
          마지막에 다음 두 가지를 만들어라:
          1. \$PATCH_PATH — 'git add -A && git diff --cached' 로 만든 unified diff.
          2. \$META_PATH — 이 스키마로 JSON 하나:
             { \"slug\": \"짧은-kebab-case-식별자(영숫자·하이픈, 40자 이내)\",
               \"title\": \"PR 제목\", \"body\": \"PR 본문(무엇을·왜·백로그 인용)\",
               \"backlog_item\": \"받은 백로그 항목 원문 요약\",
               \"notes_for_cto\": \"group-cto 기술 검증자가 특히 봐야 할 것\" }
          구현이 안 됐으면 패치를 빈 파일로 두고 메타에 이유를 적어라 — 빈 패치는
          정상 종료다. opencore 신규 기획은 이번 가동 범위 밖이다 — bizdev가 이미
          거른 백로그 항목의 구현만 한다. 질문하지 마라 — 헤드리스다."

          timeout -k 120 1680 claude -p "$PROMPT" \
            --model claude-sonnet-5 \
            --allowedTools Read Glob Grep Write Edit \
              "Bash(npm:*)" "Bash(npx:*)" "Bash(go:*)" "Bash(python3:*)" "Bash(pytest:*)" \
              "Bash(git diff:*)" "Bash(git add:*)" "Bash(git status:*)" "Bash(git log:*)" \
              "Bash(git show:*)" \
              "Write(${{ runner.temp }}/engineer.patch)" "Write(${{ runner.temp }}/engineer-meta.json)"
          # git commit·git push·gh pr create·gh issue create는 의도적으로 배제했다 —
          # 없는 것 자체가 안전장치다. Bash(npm:* 등)은 테스트·빌드 확인용일 뿐 쓰기 도구가 아니다.

          if [ -s "$PATCH_PATH" ] && [ -s "$META_PATH" ] && jq -e '.slug and .title' "$META_PATH" >/dev/null 2>&1; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: engineer-draft
          path: |
            ${{ runner.temp }}/engineer.patch
            ${{ runner.temp }}/engineer-meta.json
          retention-days: 14

  execute:
    needs: propose
    if: needs.propose.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: engineer-draft, path: draft }

      - name: 검증 — 패치 형식·동시 PR 상한, 넘기면 전체 중단(부분 집행 없음)
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s draft/engineer.patch ]; then
            echo "::notice::빈 패치 — 구현 없음, 정상 종료"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          jq -e '.slug and .title and .body' draft/engineer-meta.json >/dev/null \
            || { echo "::error::meta JSON 스키마 불일치"; exit 1; }
          SLUG=$(jq -r '.slug' draft/engineer-meta.json)
          [[ "$SLUG" =~ ^[a-z0-9-]{1,40}$ ]] || { echo "::error::slug 형식 불량: $SLUG"; exit 1; }
          OPEN=$(gh pr list --state open --json headRefName \
            -q '[.[] | select(.headRefName | startswith("auto/"))] | length')
          [ "$OPEN" -lt "$MAX_OPEN_AUTO_PRS" ] \
            || { echo "::error::열린 auto/* PR ${OPEN}건 >= 상한 ${MAX_OPEN_AUTO_PRS} — 전체 중단"; exit 1; }
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: auto/<slug>에 적용·커밋·push·PR (SWEEP_LIVE 아니면 dry-run)
        if: steps.validate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SLUG="${{ steps.validate.outputs.slug }}"
          BRANCH="auto/$SLUG"
          TITLE=$(jq -r '.title' draft/engineer-meta.json)
          BODY=$(jq -r '.body' draft/engineer-meta.json)

          if [ "$LIVE" != "true" ]; then
            echo "[dry-run] 브랜치 $BRANCH, 제목 '$TITLE'"
            git apply --check draft/engineer.patch; exit 0
          fi

          git checkout -b "$BRANCH" origin/main
          git apply draft/engineer.patch
          git -c user.name="engineer-bot" -c user.email="engineer-bot@users.noreply.github.com" add -A
          git -c user.name="engineer-bot" -c user.email="engineer-bot@users.noreply.github.com" \
            commit -m "$TITLE" -m "$(printf '%s\n\n백로그: %s\n\n자동 생성 — group-cto 기술 검증 전까지 머지하지 않는다.' \
              "$BODY" "$(jq -r '.backlog_item' draft/engineer-meta.json)")"
          git push origin "$BRANCH"

          gh pr create --title "$TITLE" \
            --body "$(printf '%s\n\n---\ngroup-cto 검증용 참고: %s\n\n이 PR은 engineer-bot(헤드리스 claude, 백로그: bizdev 판정)이 열었다. 자가승인 금지 — group-cto 기술 검증 후 사람이 머지한다.' \
              "$BODY" "$(jq -r '.notes_for_cto' draft/engineer-meta.json)")" \
            --base main --head "$BRANCH" --label "auto-engineer"
